server:
  port: 8081

spring:
  application:
    name: nimbusdesk-identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nimbusdesk}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:nimbusdesk_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

nimbusdesk:
  security:
    jwt-secret: ${JWT_SECRET:nimbusdesk-dev-secret-change-me-nimbusdesk-dev-secret}
    jwt-expiration-minutes: 60
